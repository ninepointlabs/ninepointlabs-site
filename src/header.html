    <a class="skip-link" href="#main-content">Skip to main content</a>

    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{base}}index.html" aria-label="Nine Point Labs home">
          <img src="{{base}}assets/npl-mark-ninepoint.svg" alt="" class="brand-logo" />
          <span>Nine Point Labs</span>
        </a>
        <div class="header-actions">
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Theme: Auto. Activate to switch between Auto, Light, and Dark."
          ></button>
          <button
            class="menu-toggle"
            type="button"
            data-menu-toggle
            aria-expanded="false"
            aria-controls="site-navigation"
            aria-label="Toggle navigation menu"
          >
            Menu
          </button>
        </div>
        <nav id="site-navigation" class="nav-panel" data-nav-panel aria-label="Primary">
          <ul class="nav-list">
            {{nav}}
          </ul>
        </nav>
      </div>
    </header>
